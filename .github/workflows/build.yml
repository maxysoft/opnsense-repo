name: build and publish pkg repo

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: override the plugin ref to build (defaults to the tag matching PLUGIN_VERSION)
        required: false
        default: ""

permissions:
  contents: write   # publishing releases, which are the package archive
  pages: write
  id-token: write

# one Pages deployment at a time, and never cancel one mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PLUGIN_REPO: maxysoft/opnsense-devicemonitor
  PLUGIN_DIR: net-mgmt/devicemonitor
  PLUGIN_PKGNAME: os-devicemonitor
  # OPNsense plugin build framework (Mk/, Templates/, Scripts/, Keywords/), pinned
  OPNSENSE_PLUGINS_REF: "26.7.3"

jobs:
  # One package per supported OPNsense series. The FreeBSD release must be the
  # one that series is built on, or the pkg ABI of the repo will not match the
  # firewall: 26.1 -> FreeBSD:14:amd64, 26.7 -> FreeBSD:15:amd64.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin_abi: "26.7"
            freebsd: "15.0"
          - plugin_abi: "26.1"
            freebsd: "14.3"
    outputs:
      version: ${{ steps.ver.outputs.version }}
      pkgversion: ${{ steps.ver.outputs.pkgversion }}
      tag: ${{ steps.ver.outputs.tag }}
      source_tag: ${{ steps.ver.outputs.source_tag }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A version has to identify one commit, so the plugin is built from the
      # tag matching PLUGIN_VERSION rather than from a moving branch.
      - name: Resolve plugin version and tag
        id: ver
        env:
          PLUGIN_REF_OVERRIDE: ${{ github.event.inputs.plugin_ref }}
        run: |
          set -eu
          VERSION=$(sed -n 's/^PLUGIN_VERSION=[[:space:]]*//p' "${PLUGIN_DIR}/Makefile")
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' "${PLUGIN_DIR}/Makefile")

          # PLUGIN_REVISION bumps the package without the plugin source
          # changing, so the source tag and the release tag differ.
          if [ -n "${REVISION:-}" ] && [ "${REVISION:-0}" != "0" ]; then
            PKGVERSION="${VERSION}_${REVISION}"
          else
            PKGVERSION="${VERSION}"
          fi

          SOURCE_TAG="v${VERSION}"
          RELEASE_TAG="v${PKGVERSION}"
          REF="${PLUGIN_REF_OVERRIDE:-$SOURCE_TAG}"

          if [ -z "$PLUGIN_REF_OVERRIDE" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://api.github.com/repos/${PLUGIN_REPO}/git/ref/tags/${SOURCE_TAG}")
            if [ "$code" != "200" ]; then
              echo "::error::${PLUGIN_REPO} has no tag ${SOURCE_TAG}. Tag the plugin at the commit this version should build from, or dispatch with an explicit plugin_ref."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkgversion=$PKGVERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "building ${PLUGIN_PKGNAME} $PKGVERSION from ${PLUGIN_REPO}@${REF}"

      - name: Checkout plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PLUGIN_REPO }}
          ref: ${{ steps.ver.outputs.ref }}
          path: plugin-src

      - name: Checkout OPNsense plugin build framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opnsense/plugins
          ref: ${{ env.OPNSENSE_PLUGINS_REF }}
          path: framework

      # Mk/lint.mk in the plugins tree is a stub that includes the real rules
      # from the core repository, so the lint targets only exist when core is
      # checked out next to the tree.
      - name: Checkout OPNsense core (lint rules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opnsense/core
          ref: ${{ env.OPNSENSE_PLUGINS_REF }}
          path: core

      - name: Assemble ports tree
        run: |
          set -eu

          # The version has a single source: PLUGIN_VERSION here, which also
          # selects the plugin tag to build and becomes the annotation the GUI
          # reads. The plugin repo no longer carries a copy to drift from.
          DEFAULTS=plugin-src/src/opnsense/mvc/app/models/OPNsense/DeviceMonitor/defaults.json
          if grep -q '"version"' "$DEFAULTS"; then
            echo "::error::$DEFAULTS reintroduced a version field; PLUGIN_VERSION is the only source"
            exit 1
          fi
          python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$DEFAULTS"

          mkdir -p "tree/${PLUGIN_DIR}"
          cp -R framework/Mk framework/Templates framework/Scripts framework/Keywords tree/
          cp -R "${PLUGIN_DIR}/." "tree/${PLUGIN_DIR}/"
          # plugins.mk stages with tar -p, so git modes are the installed modes.
          # The rc script is 0755 in the plugin repo; the smoke test below fails
          # the build if that ever regresses.
          cp -R plugin-src/src "tree/${PLUGIN_DIR}/src"

      # Before the first migration runs there is no config node, and Jinja's
      # default Undefined raises on attribute access. A template that walks the
      # path directly renders fine once configured and fails on a clean
      # install, which is invisible until someone installs the package.
      # Templates here therefore have to render against an empty config.
      # Drives the scanner's transition detection against a synthetic feed.
      # Catches the class of defect that only appears once the scanner has run
      # twice, which nothing else here exercises.
      - name: Run the plugin's scanner tests
        run: |
          set -eu
          if [ -f plugin-src/tests/test_scan_logic.py ]; then
            python3 plugin-src/tests/test_scan_logic.py
          else
            echo "::warning::plugin has no scanner tests at this ref"
          fi

      - name: Check configd templates render on a clean install
        run: |
          set -eu
          python3 -m pip install --quiet jinja2
          python3 - <<'PY'
          import glob, json, os, sys
          import jinja2

          base = os.path.join('tree', os.environ['PLUGIN_DIR'], 'src/opnsense/service/templates')
          env = jinja2.Environment(trim_blocks=True)   # matches configd's environment
          failed = False

          for path in sorted(glob.glob(base + '/**/*', recursive=True)):
              if not os.path.isfile(path) or os.path.basename(path) == '+TARGETS':
                  continue
              try:
                  rendered = env.from_string(open(path).read()).render(OPNsense={})
              except Exception as exc:
                  print('FAIL %s does not render without a config node: %s' % (path, exc))
                  failed = True
                  continue
              if path.endswith('.json'):
                  try:
                      json.loads(rendered)
                  except Exception as exc:
                      print('FAIL %s did not produce valid JSON: %s' % (path, exc))
                      failed = True
                      continue
              print('ok   %s' % path)

          sys.exit(1 if failed else 0)
          PY

      - name: Build package and generate repo metadata
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        env:
          PLUGIN_ABI: ${{ matrix.plugin_abi }}
          PLUGIN_HASH: ${{ github.sha }}
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
          PLUGIN_PKGVERSION: ${{ steps.ver.outputs.pkgversion }}
        with:
          release: ${{ matrix.freebsd }}
          usesh: true
          sync: rsync
          copyback: true
          envs: "PLUGIN_DIR PLUGIN_ABI PLUGIN_HASH PLUGIN_VERSION PLUGIN_PKGVERSION PLUGIN_PKGNAME GITHUB_REPOSITORY"
          prepare: |
            pkg install -y gettext-tools python3 libxml2 php84
          run: |
            set -eu
            WS=$(pwd)
            cd "tree/${PLUGIN_DIR}"

            # Official lint rules from opnsense/core. lint-acl, lint-class and
            # lint-import are skipped: they run scripts against a full core
            # checkout rather than a plugin.
            make lint-desc lint-shell lint-xml lint-model lint-exec

            # lint-model only reports, it does not fail, so turn any output
            # into a build failure.
            if [ -n "$(make lint-model 2>&1)" ]; then
              echo "FAIL: model lint findings:"; make lint-model 2>&1; exit 1
            fi

            for f in $(find src -name '*.php'); do php -l "$f" > /dev/null; done
            echo ">>> lint clean"

            # install.sh used to run msgfmt on the firewall; a package can't, so the
            # .mo files are compiled here and picked up by the generated plist
            for po in src/opnsense/mvc/app/languages/*.po; do
              msgfmt -o "${po%.po}.mo" "$po"
            done

            make package \
              PLUGIN_ABI="$PLUGIN_ABI" \
              PLUGIN_HASH="$PLUGIN_HASH" \
              PLUGIN_PHP=84

            PKGFILE=$(ls work/pkg/*.pkg)

            # --- checks: fail loudly rather than publish a broken package ---
            SRC_FILES=$(find src -type f | wc -l | tr -d ' ')
            PLIST_FILES=$(wc -l < work/src/plist | tr -d ' ')
            if [ "$PLIST_FILES" -ne "$((SRC_FILES + 1))" ]; then
              echo "FAIL: plist has $PLIST_FILES entries, expected $((SRC_FILES + 1)) (src files + version file)"
              exit 1
            fi
            pkg info -F "$PKGFILE" | grep -qE "^Name +: ${PLUGIN_PKGNAME}\$" || {
              echo "FAIL: unexpected package name"; pkg info -F "$PKGFILE"; exit 1; }
            pkg info -F "$PKGFILE" | grep -qE "^Version +: ${PLUGIN_PKGVERSION}\$" || {
              echo "FAIL: package version does not match ${PLUGIN_PKGVERSION}"; pkg info -F "$PKGFILE"; exit 1; }

            # Dependencies resolve against the FreeBSD ports repo at build time,
            # but have to exist in the OPNsense repository at install time. Those
            # differ: OPNsense ships python313, not the python3 meta package.
            # Without this check a bad dependency only shows up on a firewall as
            # "has a missing dependency".
            ABI_NOW=$(pkg config ABI)
            fetch -q -o /tmp/oscat.pkg \
              "https://pkg.opnsense.org/${ABI_NOW}/${PLUGIN_ABI}/latest/packagesite.pkg"
            tar -xOf /tmp/oscat.pkg packagesite.yaml > /tmp/oscat.yaml
            python3 - "$PKGFILE" /tmp/oscat.yaml <<'PY'
            import json, subprocess, sys
            pkgfile, catalogue = sys.argv[1], sys.argv[2]
            deps = subprocess.run(['pkg', 'query', '-F', pkgfile, '%dn'],
                                  capture_output=True, text=True).stdout.split()
            available = {json.loads(line)['name'] for line in open(catalogue) if line.strip()}
            print("declared dependencies:", deps or "(none)")
            missing = [d for d in deps if d not in available]
            if missing:
                print("FAIL: not present in the OPNsense repository: %s" % missing)
                sys.exit(1)
            print(">>> every dependency exists in the OPNsense repository")
            PY
            tar tf "$PKGFILE" | grep -q 'opnsense/version/devicemonitor$' || {
              echo "FAIL: version annotation file missing, the GUI would not see the plugin"; exit 1; }
            grep -q "\"product_abi\": \"$PLUGIN_ABI\"" "work/src/usr/local/opnsense/version/devicemonitor" || {
              echo "FAIL: built package does not declare OPNsense ABI $PLUGIN_ABI"
              cat "work/src/usr/local/opnsense/version/devicemonitor"; exit 1; }

            # --- smoke test: really install it, then remove it again ---
            # The OPNsense-only parts of the hooks are [ -f ]-guarded, so on plain
            # FreeBSD they no-op and this exercises the plist, deps and scripts.
            pkg add "$PKGFILE"
            test -x /usr/local/etc/rc.d/devicemonitor || {
              echo "FAIL: rc script installed non-executable, service would not start"; exit 1; }
            test -s /usr/local/opnsense/version/devicemonitor || {
              echo "FAIL: version annotation not installed"; exit 1; }
            test -f /usr/local/opnsense/service/conf/actions.d/actions_devicemonitor.conf || {
              echo "FAIL: configd actions not installed"; exit 1; }
            test -f /usr/local/opnsense/service/templates/OPNsense/DeviceMonitor/+TARGETS || {
              echo "FAIL: configd templates not installed"; exit 1; }
            pkg delete -y "${PLUGIN_PKGNAME}"

            # --- lay out the pkg repository ---
            ABI=$(pkg config ABI)
            SAFE_ABI=$(echo "$ABI" | tr ':' '_')
            REPO_DIR="$WS/site/repo/$ABI"
            mkdir -p "$REPO_DIR/All" "$WS/release-assets"

            # Older versions are archived as release assets. Pull the ones built
            # for this ABI back in so the catalogue keeps every version instead
            # of only the newest.
            python3 - "$GITHUB_REPOSITORY" "$SAFE_ABI" > /tmp/urls.txt <<'PY'
            import json, sys, urllib.request
            repo, safe_abi = sys.argv[1], sys.argv[2]
            url = "https://api.github.com/repos/%s/releases?per_page=100" % repo
            try:
                with urllib.request.urlopen(url, timeout=30) as fh:
                    releases = json.load(fh)
            except Exception as exc:
                sys.stderr.write("could not list releases: %s\n" % exc)
                releases = []
            for rel in releases:
                for asset in rel.get("assets", []):
                    if asset["name"].endswith("-%s.pkg" % safe_abi):
                        print(asset["browser_download_url"])
            PY

            while read -r url; do
              [ -n "$url" ] || continue
              base=$(basename "$url")
              # strip the -<abi>.pkg suffix back to the canonical package name
              orig="${base%-${SAFE_ABI}.pkg}.pkg"
              echo ">>> archived: $orig"
              fetch -q -o "$REPO_DIR/All/$orig" "$url" || echo "WARN: could not fetch $url"
            done < /tmp/urls.txt

            cp work/pkg/*.pkg "$REPO_DIR/All/"
            cp "$PKGFILE" "$WS/release-assets/${PLUGIN_PKGNAME}-${PLUGIN_PKGVERSION}-${SAFE_ABI}.pkg"

            pkg repo "$REPO_DIR"
            test -s "$REPO_DIR/meta.conf"
            test -s "$REPO_DIR/packagesite.pkg"
            echo ">>> versions in the catalogue for $ABI:"
            ls -1 "$REPO_DIR/All"

            # tarred because the pkg ABI directory name contains ':',
            # which upload-artifact rejects in a path
            cd "$WS/site" && tar -czf "$WS/repo-$PLUGIN_ABI.tgz" repo

      - name: Upload repo slice
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-${{ matrix.plugin_abi }}
          path: repo-${{ matrix.plugin_abi }}.tgz
          if-no-files-found: error

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-${{ matrix.plugin_abi }}
          path: release-assets/*.pkg
          if-no-files-found: error

  # Archive before publishing, so a version can never reach the repository
  # without a permanent copy existing to roll back to.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asset-*
          merge-multiple: true
          path: assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PKGVERSION: ${{ needs.build.outputs.pkgversion }}
          SOURCE_TAG: ${{ needs.build.outputs.source_tag }}
        run: |
          set -eu
          ls -l assets

          # Changelog from the plugin commits since the previous source tag.
          PREV=$(gh api "repos/${PLUGIN_REPO}/tags" --paginate --jq '.[].name' \
                 | grep '^v' | sort -V | grep -B1 -x "$SOURCE_TAG" | head -1 || true)

          : > /tmp/changes.md
          if [ -n "$PREV" ] && [ "$PREV" != "$SOURCE_TAG" ]; then
            gh api "repos/${PLUGIN_REPO}/compare/${PREV}...${SOURCE_TAG}" \
              --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null \
              | grep -v '^Merge ' | head -10 | sed 's/^/- /' > /tmp/changes.md || true
          fi
          [ -s /tmp/changes.md ] || echo "- see the commit history" > /tmp/changes.md

          {
            echo "### Changes"
            cat /tmp/changes.md
            echo
            echo "Add the repository, then install from System > Firmware > Plugins."
            echo "To pin this version:"
            echo
            echo '```'
            echo "pkg add https://github.com/${REPO}/releases/download/${TAG}/os-devicemonitor-${PKGVERSION}-FreeBSD_15_amd64.pkg"
            echo '```'
            echo
            echo "Use the \`FreeBSD_14_amd64\` asset on OPNsense 26.1."
          } > /tmp/notes.md
          cat /tmp/notes.md

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "release $TAG exists, refreshing its assets and notes"
            gh release upload "$TAG" assets/*.pkg --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" assets/*.pkg \
              --repo "$REPO" \
              --title "os-devicemonitor $PKGVERSION" \
              --notes-file /tmp/notes.md
          fi

  deploy:
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download repo slices
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repo-*
          merge-multiple: true
          path: slices

      - name: Merge slices into site
        run: |
          set -eu
          for t in slices/*.tgz; do
            echo "unpacking $t"
            tar -xzf "$t" -C site
          done
          find site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
